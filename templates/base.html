<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NexusAI — A powerful AI chatbot with Gemini integration, file uploads, voice input, and more.">
    <title>{% block title %}NexusAI{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Highlight.js for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">

    <style>
        /* ── CSS Reset & Variables ──────────────────────────────────────── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --transition-speed: 0.3s;
            --border-radius: 12px;
            --border-radius-sm: 8px;
            --border-radius-lg: 16px;
        }

        /* ── Dark Theme (default) ──────────────────────────────────────── */
        [data-theme="dark"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --bg-surface: #16162a;
            --bg-hover: #1e1e3a;
            --bg-input: #1a1a2e;

            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a82;

            --accent-primary: #7c5cfc;
            --accent-secondary: #5b8def;
            --accent-gradient: linear-gradient(135deg, #7c5cfc, #5b8def, #4ecdc4);
            --accent-glow: rgba(124, 92, 252, 0.25);

            --border-color: rgba(255, 255, 255, 0.06);
            --border-subtle: rgba(255, 255, 255, 0.03);

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);

            --msg-user-bg: linear-gradient(135deg, #7c5cfc, #5b8def);
            --msg-user-text: #ffffff;
            --msg-assistant-bg: #1a1a2e;
            --msg-assistant-text: #e8e8f0;

            --code-bg: #0d1117;
            --code-header-bg: #161b22;

            --scrollbar-track: #12121a;
            --scrollbar-thumb: #2a2a42;

            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        /* ── Light Theme ───────────────────────────────────────────────── */
        [data-theme="light"] {
            --bg-primary: #f8f9fb;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f2f5;
            --bg-surface: #ffffff;
            --bg-hover: #eef0f4;
            --bg-input: #f0f2f5;

            --text-primary: #1a1a2e;
            --text-secondary: #555570;
            --text-muted: #8888a0;

            --accent-primary: #6c4cf0;
            --accent-secondary: #4a7de8;
            --accent-gradient: linear-gradient(135deg, #6c4cf0, #4a7de8, #3db8a8);
            --accent-glow: rgba(108, 76, 240, 0.15);

            --border-color: rgba(0, 0, 0, 0.08);
            --border-subtle: rgba(0, 0, 0, 0.04);

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);

            --msg-user-bg: linear-gradient(135deg, #6c4cf0, #4a7de8);
            --msg-user-text: #ffffff;
            --msg-assistant-bg: #f0f2f5;
            --msg-assistant-text: #1a1a2e;

            --code-bg: #f6f8fa;
            --code-header-bg: #e8ecf0;

            --scrollbar-track: #f0f2f5;
            --scrollbar-thumb: #c8cad0;

            --danger: #dc2626;
            --success: #16a34a;
            --warning: #d97706;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background var(--transition-speed), color var(--transition-speed);
        }

        /* ── Scrollbar ─────────────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        /* ── Utility Classes ───────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius-sm);
            font-family: var(--font-family);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-speed);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--accent-primary);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-ghost:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-danger {
            background: var(--danger);
            color: #ffffff;
        }
        .btn-danger:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* ── Flash Messages ────────────────────────────────────────────── */
        .flash-messages {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .flash-msg {
            padding: 12px 20px;
            border-radius: var(--border-radius-sm);
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
        }

        .flash-msg.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .flash-msg.success {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .flash-msg.info {
            background: rgba(124, 92, 252, 0.15);
            color: var(--accent-primary);
            border-color: rgba(124, 92, 252, 0.3);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-messages" id="flashMessages">
        {% for category, message in messages %}
        <div class="flash-msg {{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    <script>
        setTimeout(() => {
            const container = document.getElementById('flashMessages');
            if (container) container.style.display = 'none';
        }, 5000);
    </script>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <!-- Theme JS (loads on every page) -->
    <script>
        // Immediate theme application to prevent flash
        (function() {
            const saved = localStorage.getItem('nexusai-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
